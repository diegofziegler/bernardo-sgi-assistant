[project]
name = "bernardo-sgi-assistant"
version = "0.1.0"
description = "Asistente flotante de soporte para SGI conectado a RAG mediante FastAPI y Redis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.2",
    "redis>=5.2.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bernardo"]